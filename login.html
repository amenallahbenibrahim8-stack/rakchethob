<!doctype html>
<html lang="ar-TN" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111014"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./css/styles.css"><title>تسجيل الدخول — ركشة حب</title><script defer src="https://unpkg.com/lucide@latest"></script></head>
<body><main class="auth-layout"><aside class="auth-aside"><img data-image="login" alt="" aria-hidden="true"><a class="brand" href="./index.html"><span class="brand-mark"><i data-lucide="orbit"></i></span><span>ركشة حب</span></a><div class="auth-quote"><p>بلاصتكم الصغيرة تستناكم كيف ما خليتوها. <em>مرحبا بيك من جديد.</em></p><span>مساحة خاصة للحظات اللي تشبهكم.</span></div></aside><section class="auth-main"><a class="auth-back" href="./index.html"><i data-lucide="arrow-right"></i> ارجع لركشة حب</a><div class="auth-main-inner"><a class="brand" href="./index.html"><span class="brand-mark"><i data-lucide="orbit"></i></span><span>ركشة حب</span></a><h1>مرحبا بيك من جديد</h1><p class="auth-intro">كمّلوا من وين وقفتوا.</p><form class="form-grid" data-auth-form data-mode="login"><div class="form-error" data-form-message role="alert"></div><div class="field"><label for="email">الإيميل</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">كلمة السر</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="كلمة السر متاعك" required minlength="8"></div><div class="form-actions"><a class="subtle-link" href="./forgot-password.html">نسيت كلمة السر؟</a><button class="button button-primary" type="submit">تسجيل الدخول <i data-lucide="arrow-left"></i></button></div></form><p class="form-foot">أول مرة مع ركشة حب؟ <a href="./signup.html">اعمل حساب</a></p></div></section></main><script type="module" src="./js/auth-pages.js"></script><script>window.addEventListener("DOMContentLoaded",()=>window.lucide?.createIcons())</script></body></html>
