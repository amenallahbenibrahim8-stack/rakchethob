<!doctype html>
<html lang="ar-TN" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111014"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./css/styles.css"><title>اعمل حساب — ركشة حب</title><script defer src="https://unpkg.com/lucide@latest"></script></head>
<body><main class="auth-layout"><aside class="auth-aside"><img data-image="signup" alt="" aria-hidden="true"><a class="brand" href="./index.html"><span class="brand-mark"><i data-lucide="orbit"></i></span><span>ركشة حب</span></a><div class="auth-quote"><p>زوز أشخاص، ومساحة خاصة بيهم. <em>وبرشة لحظات حلوة.</em></p><span>ابدأ باسم، وبعدها زيّنها على ذوقكم.</span></div></aside><section class="auth-main"><a class="auth-back" href="./index.html"><i data-lucide="arrow-right"></i> ارجع لركشة حب</a><div class="auth-main-inner"><a class="brand" href="./index.html"><span class="brand-mark"><i data-lucide="orbit"></i></span><span>ركشة حب</span></a><h1>اعمل حساب</h1><p class="auth-intro">مساحتكم تبدأ بيك.</p><form class="form-grid" data-auth-form data-mode="signup"><div class="form-error" data-form-message role="alert"></div><div class="field"><label for="display_name">اسمك</label><input id="display_name" name="display_name" autocomplete="name" placeholder="شنوة نعيطولك؟" maxlength="60" required></div><div class="field"><label for="username">اسم المستخدم</label><input id="username" name="username" autocomplete="username" placeholder="مثال: alexm" maxlength="24" minlength="3" pattern="[A-Za-z0-9_]+" required><span class="field-help">حروف وأرقام وشرطة سفلية برك.</span></div><div class="field"><label for="email">الإيميل</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">كلمة السر</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="على الأقل 8 حروف" minlength="8" required></div><div class="form-actions"><span class="field-help">مساحتكم خاصة، ديما.</span><button class="button button-primary" type="submit">اعمل حساب <i data-lucide="arrow-left"></i></button></div></form><p class="form-foot">عندك حساب؟ <a href="./login.html">تسجيل الدخول</a></p></div></section></main><script type="module" src="./js/auth-pages.js"></script><script>window.addEventListener("DOMContentLoaded",()=>window.lucide?.createIcons())</script></body></html>
